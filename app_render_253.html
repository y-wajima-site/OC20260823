<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スイーツ・ディフェンダー (Sweets Defender)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kiwi Maru', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background-color: #ffe4e6;
    }
    canvas {
      display: block;
      background: linear-gradient(180deg, #ffedf0 0%, #ffd1dc 100%);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen overflow-hidden p-2">
  <div class="relative w-full max-w-md bg-white rounded-3xl p-4 shadow-xl border-4 border-pink-300 flex flex-col items-center">
    <div class="w-full flex justify-between items-center mb-2 px-2">
      <div class="text-pink-600 font-bold text-lg flex items-center gap-1">
        <span>🧁</span> Sweets Defender
      </div>
      <div class="text-right">
        <span class="text-sm text-pink-400">SCORE:</span>
        <span id="scoreDisplay" class="text-xl font-bold text-pink-500">0</span>
      </div>
    </div>
    <div class="relative overflow-hidden rounded-2xl border-4 border-pink-200 w-full mb-3" style="aspect-ratio: 3 / 4; max-height: 60vh;">
      <canvas id="gameCanvas" class="w-full h-full"></canvas>
      <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-pink-900/40 backdrop-blur-[2px] z-10">
        <div id="startMenu" class="text-center p-6 bg-white/95 rounded-3xl shadow-lg border-4 border-pink-300 w-[90%] max-w-[320px] mx-auto">
          <h1 class="text-xl font-bold text-pink-600 mb-2">スイーツ・ディフェンダー</h1>
          <p class="text-[11px] text-pink-500 mb-4">むしば菌からお菓子の国をまもろう！</p>
          <div class="bg-pink-50 p-3 rounded-xl mb-4 text-left text-xs text-pink-700 space-y-1">
            <p class="font-bold text-center border-b border-pink-200 pb-1 mb-1">🍭 あそびかた 🍭</p>
            <p>【スマホ】画面を触って左右スライド</p>
            <p>【パソコン】マウス移動 ＆ キーボード移動</p>
            <p class="text-[10px] text-pink-400 text-center mt-1">※自動でこんぺいとうを連射します！</p>
          </div>
          <button id="startButton" class="w-full bg-pink-500 hover:bg-pink-600 active:scale-95 text-white font-bold py-3 px-6 rounded-2xl shadow-md transition text-lg">スタート！ 🧁</button>
        </div>
        <div id="gameOverMenu" class="hidden text-center p-6 bg-white/95 rounded-3xl shadow-lg border-4 border-pink-400 w-[90%] max-w-[320px] mx-auto">
          <h2 class="text-3xl font-bold text-red-500 mb-1">GAME OVER</h2>
          <p class="text-xs text-pink-500 mb-4">お菓子がむしばまれちゃった…</p>
          <div class="bg-pink-50 p-4 rounded-xl mb-6">
            <span class="text-xs text-pink-400 block font-bold">今回のスコア</span>
            <span id="finalScore" class="text-4xl font-extrabold text-pink-600">0</span>
            <div id="highScoreText" class="text-xs text-pink-400 mt-1">ハイスコア: 0</div>
          </div>
          <button id="restartButton" class="w-full bg-pink-500 hover:bg-pink-600 active:scale-95 text-white font-bold py-3 px-6 rounded-2xl shadow-md transition text-lg">もういっかいあそぶ 🍭</button>
        </div>
      </div>
      <button id="pauseButton" class="absolute top-2 right-2 bg-white/80 hover:bg-white text-pink-500 p-2 rounded-full shadow-md text-xs hidden z-20">⏸️</button>
    </div>
    <div class="w-full flex flex-col gap-2 px-2">
      <div class="flex justify-between items-center text-xs text-pink-400">
        <div>かんたん暇つぶしシューティング✨</div>
        <button id="soundToggle" class="bg-pink-100 hover:bg-pink-200 text-pink-600 px-2 py-1 rounded-lg font-bold">🔊 音ON</button>
      </div>
    </div>
  </div>
  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = true;
    function playSound(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(450, now + 0.08);
        osc.frequency.setValueAtTime(600, now + 0.16);
        osc.frequency.setValueAtTime(900, now + 0.24);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'damage') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.6);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      }
    }
    const soundToggle = document.getElementById('soundToggle');
    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? '🔊 音ON' : '🔇 音OFF';
      soundToggle.classList.toggle('bg-pink-100', soundEnabled);
      soundToggle.classList.toggle('text-pink-600', soundEnabled);
      soundToggle.classList.toggle('bg-gray-200', !soundEnabled);
      soundToggle.classList.toggle('text-gray-500', !soundEnabled);
    });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      if (player) player.y = canvas.height - 50;
    });
    let isPlaying = false, isPaused = false, score = 0, highScore = localStorage.getItem('sweets_high_score') || 0, frameCount = 0;
    let player, bullets = [], enemies = [], particles = [], items = [];
    class Player {
      constructor() {
        this.x = canvas.width / 2;
        this.y = canvas.height - 50;
        this.radius = 20;
        this.speed = 7;
        this.vx = 0;
        this.shootCooldown = 0;
        this.shootInterval = 10;
        this.lives = 3;
        this.maxLives = 3;
        this.powerLevel = 1;
        this.powerTimer = 0;
        this.shield = 0;
        this.flashTimer = 0;
      }
      update() {
        this.x += this.vx;
        if (this.x < this.radius) this.x = this.radius;
        if (this.x > canvas.width - this.radius) this.x = canvas.width - this.radius;
        if (this.powerLevel > 1) {
          this.powerTimer--;
          if (this.powerTimer <= 0) this.powerLevel = 1;
        }
        if (this.shootCooldown > 0) this.shootCooldown--;
      }
      draw() {
        if (this.flashTimer > 0 && this.flashTimer % 4 < 2) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#fbcfe8';
        ctx.beginPath();
        ctx.moveTo(-15, 5); ctx.lineTo(-10, 18); ctx.lineTo(10, 18); ctx.lineTo(15, 5);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 1.5;
        for (let i = -8; i <= 8; i += 4) {
          ctx.beginPath(); ctx.moveTo(i * 1.2, 5); ctx.lineTo(i * 0.8, 17); ctx.stroke();
        }
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-8, -2, 10, 0, Math.PI * 2); ctx.arc(8, -2, 10, 0, Math.PI * 2); ctx.arc(0, -8, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath(); ctx.arc(0, -17, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(3, -21, 5, Math.PI, Math.PI * 1.5); ctx.stroke();
        ctx.fillStyle = '#475569';
        ctx.beginPath(); ctx.arc(-5, -4, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(5, -4, 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath(); ctx.arc(-8, -1, 3, 0, Math.PI * 2); ctx.arc(8, -1, 3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, -2, 2, 0, Math.PI); ctx.stroke();
        if (this.shield > 0) {
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)'; ctx.lineWidth = 3;
          ctx.shadowBlur = 8; ctx.shadowColor = '#38bdf8';
          ctx.beginPath(); ctx.arc(0, -2, this.radius + 6, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
      shoot() {
        if (this.shootCooldown > 0) return;
        playSound('shoot');
        const bulletSpeed = -8;
        if (this.powerLevel === 1) {
          bullets.push(new Bullet(this.x, this.y - 15, 0, bulletSpeed));
        } else if (this.powerLevel === 2) {
          bullets.push(new Bullet(this.x - 8, this.y - 12, -1, bulletSpeed));
          bullets.push(new Bullet(this.x + 8, this.y - 12, 1, bulletSpeed));
        } else {
          bullets.push(new Bullet(this.x, this.y - 15, 0, bulletSpeed));
          bullets.push(new Bullet(this.x - 14, this.y - 10, -2, bulletSpeed));
          bullets.push(new Bullet(this.x + 14, this.y - 10, 2, bulletSpeed));
        }
        this.shootCooldown = this.shootInterval;
      }
    }
    class Bullet {
      constructor(x, y, vx, vy) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.radius = 5; this.angle = Math.random() * Math.PI;
        this.color = ['#fde047', '#a7f3d0', '#fbcfe8', '#bfdbfe'][Math.floor(Math.random() * 4)];
      }
      update() { this.x += this.vx; this.y += this.vy; this.angle += 0.15; }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = this.color;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 4); ctx.rect(-this.radius, -this.radius / 2, this.radius * 2, this.radius);
        }
        ctx.fill(); ctx.restore();
      }
    }
    class Enemy {
      constructor() {
        this.radius = 14 + Math.random() * 8;
        this.x = this.radius + Math.random() * (canvas.width - this.radius * 2);
        this.y = -this.radius;
        this.speed = 1.2 + (score / 200) + Math.random() * 0.8;
        this.hp = Math.ceil(this.radius / 8); this.maxHp = this.hp;
        const types = ['germ', 'capsule', 'lemon'];
        this.type = types[Math.floor(Math.random() * types.length)];
        this.pulse = 0;
      }
      update() { this.y += this.speed; this.pulse += 0.05; }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y);
        const scaleY = 1 + Math.sin(this.pulse) * 0.05;
        const scaleX = 1 - Math.sin(this.pulse) * 0.05;
        ctx.scale(scaleX, scaleY);
        if (this.type === 'germ') {
          ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-this.radius + 2, -2); ctx.lineTo(-this.radius - 2, -10); ctx.lineTo(-2, -this.radius + 2);
          ctx.moveTo(this.radius - 2, -2); ctx.lineTo(this.radius + 2, -10); ctx.lineTo(2, -this.radius + 2);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-5, 3); ctx.lineTo(-3, 0); ctx.lineTo(-1, 3); ctx.moveTo(-1, 3); ctx.lineTo(1, 0); ctx.lineTo(3, 3); ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-2, -1); ctx.moveTo(7, -4); ctx.lineTo(2, -1); ctx.stroke();
        } else if (this.type === 'capsule') {
          ctx.rotate(this.pulse * 0.15);
          ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, this.radius, Math.PI, 0); ctx.fill(); ctx.fillRect(-this.radius, 0, this.radius * 2, this.radius * 0.3);
          ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI); ctx.fill(); ctx.fillRect(-this.radius, -this.radius * 0.3, this.radius * 2, this.radius * 0.3);
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-4, -1, 2.5, 0, Math.PI * 2); ctx.arc(4, -1, 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(-4, -1, 1, 0, Math.PI * 2); ctx.arc(4, -1, 1, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.ellipse(0, 0, this.radius * 1.1, this.radius * 0.8, Math.PI / 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.arc(-this.radius * 1.0, -1, 2.5, 0, Math.PI * 2); ctx.arc(this.radius * 1.0, 1, 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#713f12'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-4, -2); ctx.lineTo(-8, 0); ctx.moveTo(8, -4); ctx.lineTo(4, -2); ctx.lineTo(8, 0); ctx.stroke();
        }
        if (this.hp < this.maxHp) {
          const barW = this.radius * 1.4; ctx.fillStyle = '#ef4444'; ctx.fillRect(-barW / 2, -this.radius - 8, barW, 3);
          ctx.fillStyle = '#22c55e'; ctx.fillRect(-barW / 2, -this.radius - 8, barW * (this.hp / this.maxHp), 3);
        }
        ctx.restore();
      }
    }
    class Item {
      constructor(x, y) {
        this.x = x; this.y = y; this.radius = 11; this.speedY = 1.3; this.pulse = 0;
        const rand = Math.random();
        if (rand < 0.4) { this.type = 'candy'; this.color = '#fb7185'; this.label = '🍬'; }
        else if (rand < 0.75) { this.type = 'shield'; this.color = '#38bdf8'; this.label = '🛡️'; }
        else { this.type = 'heart'; this.color = '#f43f5e'; this.label = '❤️'; }
      }
      update() { this.y += this.speedY; this.x += Math.sin(this.pulse) * 0.5; this.pulse += 0.05; }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath(); ctx.arc(0, 0, this.radius + 3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.label, 0, 1);
        ctx.restore();
      }
    }
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 5; this.vy = (Math.random() - 0.5) * 5;
        this.radius = 1.5 + Math.random() * 3; this.color = color; this.alpha = 1; this.decay = 0.02 + Math.random() * 0.02;
      }
      update() { this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
      draw() {
        ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
    function createExplosion(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }
    function checkCollision(obj1, obj2) {
      return Math.hypot(obj1.x - obj2.x, obj1.y - obj2.y) < obj1.radius + obj2.radius;
    }
    function initGame() {
      score = 0; frameCount = 0; document.getElementById('scoreDisplay').textContent = score;
      player = new Player(); bullets = []; enemies = []; particles = []; items = [];
      isPlaying = true; isPaused = false;
    }
    function update() {
      if (!isPlaying || isPaused) return;
      frameCount++; player.update(); player.shoot();
      const spawnInterval = Math.max(25, 55 - Math.floor(score / 60) * 3);
      if (frameCount % spawnInterval === 0) enemies.push(new Enemy());
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        if (bullets[i].y < -20 || bullets[i].x < -20 || bullets[i].x > canvas.width + 20) bullets.splice(i, 1);
      }
      for (let i = items.length - 1; i >= 0; i--) {
        items[i].update();
        if (checkCollision(player, items[i])) {
          playSound('powerup'); createExplosion(items[i].x, items[i].y, items[i].color, 10);
          if (items[i].type === 'candy') {
            player.powerLevel = Math.min(3, player.powerLevel + 1); player.powerTimer = 400;
          } else if (items[i].type === 'shield') {
            player.shield = 1;
          } else if (items[i].type === 'heart') {
            player.lives = Math.min(player.maxLives, player.lives + 1);
          }
          items.splice(i, 1); continue;
        }
        if (items[i].y > canvas.height + 20) items.splice(i, 1);
      }
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i]; enemy.update();
        if (checkCollision(player, enemy)) {
          createExplosion(enemy.x, enemy.y, '#fca5a5', 10); enemies.splice(i, 1);
          if (player.flashTimer <= 0) {
            if (player.shield > 0) { player.shield = 0; playSound('hit'); }
            else {
              player.lives--; player.flashTimer = 45; playSound('damage');
              if (player.lives <= 0) gameOver();
            }
          }
          continue;
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
          const bullet = bullets[j];
          if (checkCollision(enemy, bullet)) {
            enemy.hp--; createExplosion(bullet.x, bullet.y, bullet.color, 3);
            bullets.splice(j, 1); playSound('hit');
            if (enemy.hp <= 0) {
              createExplosion(enemy.x, enemy.y, enemy.type === 'germ' ? '#d8b4fe' : enemy.type === 'capsule' ? '#93c5fd' : '#fef08a', 12);
              if (Math.random() < 0.16) items.push(new Item(enemy.x, enemy.y));
              score += Math.round(enemy.radius);
              document.getElementById('scoreDisplay').textContent = score;
              enemies.splice(i, 1); break;
            }
          }
        }
        if (enemy && enemy.y > canvas.height + enemy.radius) {
          enemies.splice(i, 1);
          if (player.flashTimer <= 0) {
            if (player.shield > 0) { player.shield = 0; }
            else {
              player.lives--; player.flashTimer = 45; playSound('damage');
              if (player.lives <= 0) gameOver();
            }
          }
        }
      }
      if (player.flashTimer > 0) player.flashTimer--;
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      for (let x = 15; x < canvas.width; x += 30) {
        for (let y = 15; y < canvas.height; y += 30) {
          ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
        }
      }
      bullets.forEach(b => b.draw()); items.forEach(it => it.draw()); enemies.forEach(e => e.draw()); particles.forEach(p => p.draw());
      if (player) player.draw();
      if (player) {
        ctx.fillStyle = '#f43f5e'; ctx.font = '18px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        let hearts = '';
        for (let i = 0; i < player.lives; i++) hearts += '❤️';
        ctx.fillText(hearts, 10, 10);
        if (player.powerLevel > 1) {
          const barW = 80; const barH = 6; const bx = canvas.width - barW - 10; const by = 15;
          ctx.fillStyle = 'rgba(244, 114, 182, 0.3)'; ctx.fillRect(bx, by, barW, barH);
          ctx.fillStyle = '#f472b6'; ctx.fillRect(bx, by, barW * (player.powerTimer / 400), barH);
        }
      }
    }
    function gameOver() {
      isPlaying = false; playSound('gameover');
      if (score > highScore) { highScore = score; localStorage.setItem('sweets_high_score', highScore); }
      document.getElementById('finalScore').textContent = score;
      document.getElementById('highScoreText').textContent = 'ハイスコア: ' + highScore;
      document.getElementById('startMenu').classList.add('hidden');
      document.getElementById('gameOverMenu').classList.remove('hidden');
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('pauseButton').classList.add('hidden');
    }
    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    function handleMove(clientX) {
      if (!isPlaying || isPaused || !player) return;
      const rect = canvas.getBoundingClientRect();
      player.x = (clientX - rect.left) * (canvas.width / rect.width);
    }
    canvas.addEventListener('touchmove', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX); }, { passive: true });
    canvas.addEventListener('touchstart', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX); }, { passive: true });
    canvas.addEventListener('mousemove', (e) => { handleMove(e.clientX); });
    window.addEventListener('keydown', (e) => {
      if (!isPlaying || isPaused || !player) return;
      if (e.key === 'ArrowLeft' || e.key === 'Left') player.vx = -player.speed;
      else if (e.key === 'ArrowRight' || e.key === 'Right') player.vx = player.speed;
    });
    window.addEventListener('keyup', (e) => {
      if (!player) return;
      if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'ArrowRight' || e.key === 'Right') player.vx = 0;
    });
    const startButton = document.getElementById('startButton');
    const restartButton = document.getElementById('restartButton');
    const overlay = document.getElementById('overlay');
    const pauseButton = document.getElementById('pauseButton');
    function startGameFlow() { overlay.classList.add('hidden'); pauseButton.classList.remove('hidden'); initGame(); }
    startButton.addEventListener('click', startGameFlow);
    restartButton.addEventListener('click', startGameFlow);
    pauseButton.addEventListener('click', () => { isPaused = !isPaused; pauseButton.textContent = isPaused ? '▶️' : '⏸️'; });
    window.addEventListener('DOMContentLoaded', () => { resizeCanvas(); gameLoop(); });
  </script>
</body>
</html>
